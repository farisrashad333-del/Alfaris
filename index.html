<meta name="theme-color" content="#0a2166">
<meta property="og:title" content="مصنع الفارس للمراتب والإسفنج">

<style>
  :root{
    --blue-1:#11118d; --blue-2:#000061; --blue-3:#00004d; --blue-4:#00002f;
    --cyan:#55e8ff;
    --glass:rgba(255,255,255,.09); --glass-line:rgba(255,255,255,.22);
    --text:#fff; --muted:rgba(255,255,255,.74);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--blue-4)}
  body{
    min-height:100vh;
    font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
    color:var(--text);
    background:radial-gradient(90% 55% at 50% 12%, var(--blue-1), var(--blue-2) 55%, var(--blue-3) 85%, var(--blue-4));
    background-attachment:fixed;background-image:radial-gradient(ellipse at 20% 10%,rgba(50,60,210,.16),transparent 42%),radial-gradient(ellipse at 80% 70%,rgba(20,30,160,.12),transparent 45%),radial-gradient(90% 55% at 50% 12%,var(--blue-1),var(--blue-2) 55%,var(--blue-3) 85%,var(--blue-4));
    padding:max(14px,env(safe-area-inset-top)) clamp(14px,4vw,28px) max(18px,env(safe-area-inset-bottom));
    display:flex;justify-content:center;
  }
  main{width:100%;max-width:420px}
  @media (min-width:640px){ main{max-width:600px} body{padding-top:max(28px,env(safe-area-inset-top))} }
  @media (min-width:1024px){ main{max-width:720px} }

  /* ---------- الشعار + اللمعة ---------- */
  .brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:14px}
  .logo{
    position:relative;width:clamp(84px,19vw,108px);
    filter:drop-shadow(0 8px 20px rgba(0,0,0,.35));
    animation:rise .8s cubic-bezier(.2,.7,.2,1) both;
  }
  .logo img{width:100%;height:auto;display:block}
  .logo::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,transparent 40%,rgba(120,232,255,.95) 50%,transparent 60%);
    background-size:300% 100%;background-position:0% 0;
    -webkit-mask:url("logo.png") center/100% 100% no-repeat;
            mask:url("logo.png") center/100% 100% no-repeat;
    animation:sheen 1.7s .7s ease-out 1 both;
  }
  .tagline{margin-top:8px;font-family:"Reem Kufi",sans-serif;font-weight:500;font-size:1.05rem;color:rgba(255,255,255,.92)}

  /* ---------- الأزرار (صغيرة) ---------- */
  .actions{display:flex;flex-direction:column;gap:8px}
  .top{display:flex;gap:8px}
  .more{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}

  .act{
    display:flex;align-items:center;gap:10px;
    padding:7px 12px;min-height:52px;border-radius:14px;
    text-decoration:none;color:var(--text);
    transition:transform .15s ease, filter .2s ease, background .2s ease;
  }
  .act:active{transform:scale(.98)}
  .act .ico{width:36px;height:36px;flex:none;display:grid;place-items:center}
  .act .ico svg{width:100%;height:100%;display:block}
  .act .tx{flex:1;min-width:0}
  .act .tx b{display:block;font-weight:700;font-size:.98rem;line-height:1.3}
  .act .tx span{display:block;font-size:.8rem;margin-top:1px;opacity:.88;line-height:1.35}
  .act .go{width:16px;height:16px;flex:none;opacity:.65}

  .act.wa{
    flex:1;min-width:0;color:#04230f;
    background:linear-gradient(180deg,#43e97b,#25D366 60%,#1aa84f);
    box-shadow:0 8px 20px -10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4);
  }
  /* زرار الاتصال الصغير */
  .callbtn{
    flex:none;width:clamp(80px,21vw,100px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    padding:6px 4px;border-radius:14px;background:#fff;color:#00004d;text-decoration:none;
    box-shadow:0 8px 20px -10px rgba(0,0,0,.5);
    transition:transform .15s ease, filter .2s ease;
  }
  .callbtn svg{width:16px;height:16px}
  .callbtn b{font-size:.88rem;font-weight:700;line-height:1.2}
  .callbtn small{font-size:.68rem;font-weight:500;opacity:.8}
  .callbtn:active{transform:scale(.97)}

  .act.map,.act.plain{
    background:var(--glass);border:1px solid var(--glass-line);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .act.plain .ico{border:1px solid var(--cyan);border-radius:10px;color:var(--cyan);padding:8px}
  .act.map .tx span,.act.plain .tx span{color:var(--muted);opacity:1}
  @media (hover:hover){
    .act:hover,.callbtn:hover{filter:brightness(1.06)}
    .act.map:hover,.act.plain:hover{background:rgba(255,255,255,.15);filter:none}
  }

  /* ---------- السوشيال (تحت الخريطة) ---------- */
  .social{margin-top:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
  .soc{
    display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 10px;border-radius:12px;
    background:var(--glass);border:1px solid var(--glass-line);color:#fff;text-decoration:none;
    font-weight:600;font-size:.92rem;transition:background .2s,transform .15s;
  }
  .soc .ico{width:26px;height:26px;flex:none}
  .soc .ico svg{width:100%;height:100%;display:block}
  .soc:active{transform:scale(.97)}
  @media (hover:hover){.soc:hover{background:rgba(255,255,255,.16)}}
  @media (max-width:639px){ .grid .soc:last-child:nth-child(odd){grid-column:1/-1} }

  /* ---------- الخدمات (تحت خالص) ---------- */
  .about{
    margin-top:12px;padding:12px 14px 10px;border-radius:14px;
    background:rgba(0,0,47,.48);border:1px solid var(--glass-line);
  }
  .about h2{font-family:"Reem Kufi",sans-serif;font-weight:500;font-size:1rem;color:var(--cyan);margin-bottom:6px}
  .about ul{list-style:none;display:grid;gap:5px}
  @media (min-width:760px){ .about ul{grid-template-columns:repeat(3,1fr);gap:14px} }
  .about li{position:relative;padding-inline-start:15px;line-height:1.5;font-size:.9rem}
  .about li::before{content:"";position:absolute;inset-inline-start:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--cyan)}
  .about small{color:var(--muted);font-size:.82rem;margin-inline-start:4px}
  .mgr{margin-top:8px;padding-top:8px;border-top:1px solid var(--glass-line);color:var(--muted);font-size:.85rem;text-align:center}
  .mgr b{color:#fff;font-weight:600}

  footer{margin-top:12px;text-align:center;color:var(--muted);font-size:.74rem}
  a:focus-visible{outline:2px solid #fff;outline-offset:3px}
  svg.line{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes sheen{from{background-position:0% 0}to{background-position:100% 0}}
  @media (prefers-reduced-motion:reduce){.logo{animation:none}.logo::after{display:none}*{transition:none!important}}
</style>
</head>

  `<a class="act ${cls}" href="${href}" ${newTab ? ext : ""}>
     <span class="ico">${ico}</span>
     <span class="tx"><b>${title}</b>${sub ? `<span>${sub}</span>` : ""}</span>
     <span class="go">${L.go}</span>
   </a>`;

/* ---------- الصف الأول: واتساب (كبير) + اتصال (صغير) ---------- */
let topRow = "";
if (SITE.whatsapp) {
  const href = `https://wa.me/${SITE.whatsapp}?text=${encodeURIComponent(SITE.whatsappMessage || "")}`;
  topRow += `<a class="act wa" href="${href}" ${ext}>
     <span class="ico">${B.wa}</span>
     <span class="tx"><b>ابعت رسالة واتساب</b><span>افتح محادثة مباشرة</span></span>
   </a>`;
}
if (SITE.phone) {
  topRow += `<a class="callbtn" href="tel:${SITE.phone}" aria-label="اتصل بنا على ${SITE.phone}">
     ${L.tel}<b>اتصل</b><small dir="ltr">${SITE.phone}</small>
   </a>`;
}

/* ---------- باقي الأزرار ---------- */
const more = [];
if (SITE.mapUrl) {
  more.push(act("map", B.map, "العنوان على الخريطة (GPS)",
    SITE.addressText || "افتح موقع المصنع على Google Maps", SITE.mapUrl));
}
if (SITE.catalog) {
  more.push(act("plain", L.book, "شوف الكتالوج", "الموديلات والمقاسات", SITE.catalog));
}
if (SITE.telegram) {
  more.push(act("plain", B.tg, "تليجرام", "@" + SITE.telegram, `https://t.me/${SITE.telegram}`));
}
document.getElementById("actions").innerHTML =
  (topRow ? `<div class="top">${topRow}</div>` : "") +
  (more.length ? `<div class="more">${more.join("")}</div>` : "");

/* ---------- السوشيال ---------- */
const soc = [
  ["facebook","فيسبوك",B.fb],["instagram","انستجرام",B.ig],
  ["tiktok","تيك توك",B.tt],["youtube","يوتيوب",B.yt]
].filter(([k]) => SITE[k]);
if (soc.length) {
  document.getElementById("grid").innerHTML = soc.map(([k,n,ic]) =>
    `<a class="soc" href="${SITE[k]}" ${ext}><span class="ico">${ic}</span>${n}</a>`).join("");
  document.getElementById("social").hidden = false;
}
</script>
</body>
</html>
